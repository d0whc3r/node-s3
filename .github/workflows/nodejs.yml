name: Nodejs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: access-mock-key
          MINIO_ROOT_PASSWORD: secret-mock-key
        ports:
          - 9000:9000
        options: --entrypoint sh -c "minio server /data"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build:base
      - run: pnpm test:coverage
        env:
          CI: true
          ENDPOINT: http://localhost:9000
          ACCESS_KEY: access-mock-key
          SECRET_KEY: secret-mock-key

  build-sea:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: node-s3-linux-x64
            binary: node-s3
          - os: macos-latest
            artifact: node-s3-macos-arm64
            binary: node-s3
          - os: windows-latest
            artifact: node-s3-win-x64.exe
            binary: node-s3.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:sea
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
