name: Nodejs

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build:base
      - run: pnpm test:coverage
        env:
          CI: true

  integration:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start S3-compatible server (Chainguard MinIO)
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=access-mock-key \
            -e MINIO_ROOT_PASSWORD=secret-mock-key \
            cgr.dev/chainguard/minio:latest server /tmp/data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO is ready"
              exit 0
            fi
            sleep 1
          done
          docker logs minio
          exit 1
      - name: Run S3 integration tests
        run: pnpm test:integration
        env:
          CI: true
          ENDPOINT: http://localhost:9000
          ACCESS_KEY: access-mock-key
          SECRET_KEY: secret-mock-key
          SSL_ENABLED: 'false'

  build-sea:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: node-s3-linux-x64
            binary: node-s3
          - os: macos-latest
            artifact: node-s3-macos-arm64
            binary: node-s3
          - os: windows-latest
            artifact: node-s3-win-x64.exe
            binary: node-s3.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:sea
      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p release-assets
          cp "${{ matrix.binary }}" "release-assets/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/${{ matrix.artifact }}

  release:
    needs: [verify, integration, build-sea]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:base
      - name: Download SEA binaries
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Semantic Release
        run: pnpm semantic-release
        env:
          HUSKY: '0'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
